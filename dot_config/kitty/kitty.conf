# Kitty terminal settings adapted from the Catppuccin Mocha theme.
font_family Monaspace Neon NF
font_size 12.0
window_padding_width 10
scrollback_lines 10000
cursor_shape block
cursor_blink_interval 0
background_opacity 1.0

foreground #cdd6f4
background #1e1e2e
selection_foreground #bac2de
selection_background #45475a
cursor #89b4fa

# Foot regular and bright palettes, mapped to Kitty's 16 ANSI colors.
color0  #11111b
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #74c7ec
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #74c7ec
color15 #cdd6f4
