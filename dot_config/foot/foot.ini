# ~/.config/foot/foot.ini

[main]
font=Monaspace Neon NF:size=12
pad=10x10
selection-target=clipboard

[bell]
system=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

# Forest Green
[colors-dark]
alpha=1.0
cursor=192324 5a8e73
foreground=dce8e1
background=192324

regular0=213230
regular1=b97872
regular2=5a8e73
regular3=b9a66c
regular4=6f9a91
regular5=43725d
regular6=6f9a91
regular7=dce8e1

bright0=43725d
bright1=b97872
bright2=5a8e73
bright3=b9a66c
bright4=6f9a91
bright5=5a8e73
bright6=6f9a91
bright7=f3f7f5

16=b9a66c
17=b97872

selection-foreground=f3f7f5
selection-background=345b4b

search-box-no-match=192324 b97872
search-box-match=f3f7f5 345b4b

jump-labels=192324 b9a66c
urls=6f9a91

# foot has no native panes or tabs, so these shortcuts use OS windows.
[key-bindings]
# Use Ctrl+C for copying selected text; retain the conventional shortcut too.
clipboard-copy=Control+c Control+Shift+c XF86Copy
spawn-terminal=Control+Shift+Return Control+Shift+t
quit=Control+Shift+w
