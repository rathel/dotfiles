# ~/.config/foot/foot.ini

[main]
font=Monaspace Neon NF:size=12
pad=10x10
selection-target=clipboard

[bell]
system=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

# TokyoNight Night
[colors-dark]
alpha=1.0
cursor=1a1b26 7aa2f7
foreground=c0caf5
background=1a1b26

regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

16=ff9e64
17=f7768e

selection-foreground=e0e6ff
selection-background=33467c

search-box-no-match=1a1b26 f7768e
search-box-match=e0e6ff 33467c

jump-labels=1a1b26 e0af68
urls=7aa2f7

# foot has no native panes or tabs, so these shortcuts use OS windows.
[key-bindings]
# Use Ctrl+C for copying selected text; retain the conventional shortcut too.
clipboard-copy=Control+c Control+Shift+c XF86Copy
spawn-terminal=Control+Shift+Return Control+Shift+t
quit=Control+Shift+w
