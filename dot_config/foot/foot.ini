# ~/.config/foot/foot.ini

[main]
font=Monaspace Neon NF:size=12
pad=10x10
selection-target=clipboard

[bell]
system=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

# Nord - Polar Night
[colors-dark]
alpha=1.0
cursor=2e3440 88c0d0
foreground=d8dee9
background=2e3440

regular0=3b4252
regular1=bf616a
regular2=a3be8c
regular3=ebcb8b
regular4=81a1c1
regular5=b48ead
regular6=88c0d0
regular7=e5e9f0

bright0=4c566a
bright1=bf616a
bright2=a3be8c
bright3=ebcb8b
bright4=81a1c1
bright5=b48ead
bright6=8fbcbb
bright7=eceff4

16=d08770
17=bf616a

selection-foreground=eceff4
selection-background=434c5e

search-box-no-match=2e3440 bf616a
search-box-match=eceff4 434c5e

jump-labels=2e3440 d08770
urls=88c0d0

# foot has no native panes or tabs, so these shortcuts use OS windows.
[key-bindings]
# Use Ctrl+C for copying selected text; retain the conventional shortcut too.
clipboard-copy=Control+c Control+Shift+c XF86Copy
spawn-terminal=Control+Shift+Return Control+Shift+t
quit=Control+Shift+w
