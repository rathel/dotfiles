# ~/.config/foot/foot.ini

[main]
font=Monaspace Neon NF:size=12
pad=10x10
selection-target=clipboard

[bell]
system=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

# Catppuccin Mocha
[colors-dark]
alpha=1.0
cursor=1e1e2e 89b4fa
foreground=cdd6f4
background=1e1e2e

regular0=11111b
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=74c7ec
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=74c7ec
bright7=cdd6f4

16=fab387
17=f38ba8

selection-foreground=bac2de
selection-background=45475a

search-box-no-match=1e1e2e f38ba8
search-box-match=bac2de 45475a

jump-labels=1e1e2e f9e2af
urls=89b4fa

# foot has no native panes or tabs, so these shortcuts use OS windows.
[key-bindings]
# Use Ctrl+C for copying selected text; retain the conventional shortcut too.
clipboard-copy=Control+Shift+c XF86Copy
spawn-terminal=Control+Shift+Return Control+Shift+t
quit=Control+Shift+w
