set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg extended-keys on
set -sg extended-keys-format csi-u

# Nord - Polar Night
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] #S #[default]"
set -g status-right "#[fg=#81a1c1]%Y-%m-%d #[fg=#88c0d0,bold]%H:%M "
set -g window-status-format "#[bg=#2e3440,fg=#4c566a] #I:#W "
set -g window-status-current-format "#[bg=#3b4252,fg=#d8dee9,bold] #I:#W "
set -g window-status-bell-style "bg=#bf616a,fg=#eceff4,bold"
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"
set -g message-style "bg=#3b4252,fg=#d8dee9"
set -g message-command-style "bg=#3b4252,fg=#88c0d0"
set -g mode-style "bg=#434c5e,fg=#eceff4"
set -g clock-mode-colour "#88c0d0"
