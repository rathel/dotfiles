set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg extended-keys on
set -sg extended-keys-format csi-u

# Catppuccin Mocha
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default]"
set -g status-right "#[fg=#74c7ec]%Y-%m-%d #[fg=#89b4fa,bold]%H:%M "
set -g window-status-format "#[bg=#1e1e2e,fg=#585b70] #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W "
set -g window-status-bell-style "bg=#f38ba8,fg=#bac2de,bold"
set -g pane-border-style "fg=#181825"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#89b4fa"
set -g mode-style "bg=#45475a,fg=#bac2de"
set -g clock-mode-colour "#89b4fa"
