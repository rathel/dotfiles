set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg extended-keys on
set -sg extended-keys-format csi-u

# Forest Green
set -g status-style "bg=#192324,fg=#dce8e1"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#5a8e73,fg=#192324,bold] #S #[default]"
set -g status-right "#[fg=#6f9a91]%Y-%m-%d #[fg=#5a8e73,bold]%H:%M "
set -g window-status-format "#[bg=#192324,fg=#43725d] #I:#W "
set -g window-status-current-format "#[bg=#29463d,fg=#dce8e1,bold] #I:#W "
set -g window-status-bell-style "bg=#b97872,fg=#f3f7f5,bold"
set -g pane-border-style "fg=#213230"
set -g pane-active-border-style "fg=#5a8e73"
set -g message-style "bg=#29463d,fg=#dce8e1"
set -g message-command-style "bg=#29463d,fg=#5a8e73"
set -g mode-style "bg=#345b4b,fg=#f3f7f5"
set -g clock-mode-colour "#5a8e73"
