# Forest Green
colourful: true

filekinds:
  normal: {foreground: "#dce8e1"}
  directory: {foreground: "#6f9a91"}
  symlink: {foreground: "#6f9a91"}
  pipe: {foreground: "#43725d"}
  block_device: {foreground: "#b9a66c"}
  char_device: {foreground: "#b9a66c"}
  socket: {foreground: "#43725d"}
  special: {foreground: "#6f9a91"}
  executable: {foreground: "#5a8e73"}
  mount_point: {foreground: "#5a8e73"}

perms:
  user_read: {foreground: "#6f9a91", is_bold: true}
  user_write: {foreground: "#b9a66c", is_bold: true}
  user_execute_file: {foreground: "#5a8e73", is_bold: true}
  user_execute_other: {foreground: "#5a8e73", is_bold: true}
  group_read: {foreground: "#6f9a91"}
  group_write: {foreground: "#b9a66c"}
  group_execute: {foreground: "#5a8e73"}
  other_read: {foreground: "#6f9a91"}
  other_write: {foreground: "#b9a66c"}
  other_execute: {foreground: "#5a8e73"}
  special_user_file: {foreground: "#43725d"}
  special_other: {foreground: "#b97872"}
  attribute: {foreground: "#43725d"}

size:
  major: {foreground: "#dce8e1"}
  minor: {foreground: "#6f9a91"}
  number_byte: {foreground: "#43725d"}
  number_kilo: {foreground: "#6f9a91"}
  number_mega: {foreground: "#6f9a91"}
  number_giga: {foreground: "#6f9a91"}
  number_huge: {foreground: "#43725d"}
  unit_byte: {foreground: "#43725d"}
  unit_kilo: {foreground: "#6f9a91"}
  unit_mega: {foreground: "#6f9a91"}
  unit_giga: {foreground: "#6f9a91"}
  unit_huge: {foreground: "#43725d"}

users:
  user_you: {foreground: "#dce8e1"}
  user_root: {foreground: "#b97872"}
  user_other: {foreground: "#43725d"}
  group_yours: {foreground: "#f3f7f5"}
  group_other: {foreground: "#43725d"}
  group_root: {foreground: "#b97872"}

links:
  normal: {foreground: "#6f9a91"}
  multi_link_file: {foreground: "#6f9a91"}

git:
  new: {foreground: "#5a8e73"}
  modified: {foreground: "#b9a66c"}
  deleted: {foreground: "#b97872"}
  renamed: {foreground: "#6f9a91"}
  typechange: {foreground: "#43725d"}
  ignored: {foreground: "#43725d"}
  conflicted: {foreground: "#b97872"}

git_repo:
  branch_main: {foreground: "#6f9a91"}
  branch_other: {foreground: "#43725d"}
  git_clean: {foreground: "#5a8e73"}
  git_dirty: {foreground: "#b97872"}

security_context:
  colon: {foreground: "#43725d"}
  user: {foreground: "#6f9a91"}
  role: {foreground: "#43725d"}
  typ: {foreground: "#5a8e73"}
  range: {foreground: "#6f9a91"}

file_type:
  image: {foreground: "#43725d"}
  video: {foreground: "#b97872"}
  music: {foreground: "#5a8e73"}
  lossless: {foreground: "#6f9a91"}
  crypto: {foreground: "#b9a66c"}
  document: {foreground: "#dce8e1"}
  compressed: {foreground: "#b9a66c"}
  temp: {foreground: "#b97872"}
  compiled: {foreground: "#6f9a91"}
  source: {foreground: "#6f9a91"}

punctuation: {foreground: "#43725d"}
date: {foreground: "#b9a66c"}
inode: {foreground: "#dce8e1"}
blocks: {foreground: "#43725d"}
header: {foreground: "#f3f7f5"}
octal: {foreground: "#6f9a91"}
flags: {foreground: "#6f9a91"}

symlink_path: {foreground: "#6f9a91"}
control_char: {foreground: "#b9a66c"}
broken_symlink: {foreground: "#b97872"}
broken_path_overlay: {foreground: "#43725d"}
