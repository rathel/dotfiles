[misc]
# Prime sudo once, then keep credentials warm during long upgrades.
pre_sudo = true
sudo_loop = true

# Skip IDE updaters that are intentionally not used.
disable = ["antigravity", "windsurf"]

# Apply dotfiles first and defer the system package upgrade until the end.
first = ["chezmoi"]
last = ["system"]

# Continue unattended and tolerate failures in optional update groups.
ask_retry = false
ignore_failures = ["custom_commands", "git_repos"]

cleanup = true
notify_end = "never"
