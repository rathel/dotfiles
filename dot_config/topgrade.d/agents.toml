# CLI updaters not already covered by Topgrade built-ins or npm.
[commands]
"AGY" = "agy update"
# PATH resolves Copilot to the standalone installation, not its npm copy.
"Copilot" = "copilot update"
"Droid" = "droid update"
"Goose" = "goose update"
"Herdr" = "herdr update"
# Retain OpenClaw's post-update doctor, plugin sync, and service restart.
"OpenClaw" = "openclaw update"
