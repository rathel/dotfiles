onboarding = false
[terminal]
# Always start new panes, tabs, and workspaces in the home directory.
new_cwd = "home"

[theme]
# Nord - Polar Night, matching ~/.config/kitty/kitty.conf
name = "nord"

[theme.custom]
panel_bg = "#2e3440"
surface0 = "#434c5e"
surface1 = "#3b4252"
surface_dim = "#2e3440"
overlay0 = "#4c566a"
overlay1 = "#81a1c1"
text = "#d8dee9"
subtext0 = "#e5e9f0"
mauve = "#b48ead"
green = "#a3be8c"
yellow = "#ebcb8b"
red = "#bf616a"
blue = "#81a1c1"
teal = "#8fbcbb"
peach = "#d08770"
accent = "#88c0d0"

[keys]
navigate_workspace_down = "j"
navigate_workspace_up = "k"

[experimental]
kitty_graphics = true
