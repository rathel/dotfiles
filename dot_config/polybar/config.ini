[colors]
background = #2e3440
background-alt = #3b4252
surface = #434c5e
muted = #4c566a
text = #d8dee9
bright-text = #eceff4
green = #a3be8c
green-soft = #8fbcbb
teal = #8fbcbb
cyan = #88c0d0
blue = #81a1c1
yellow = #ebcb8b
red = #bf616a

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
width = 100%
height = 36
bottom = false
fixed-center = true
background = ${colors.background}
foreground = ${colors.text}
line-size = 0
border-size = 0
padding-left = 8
padding-right = 8
module-margin = 1
separator =

font-0 = Monaspace Neon NF:size=12;2

modules-left = brightness network bluetooth memory cpu swap
modules-center = date
modules-right = reboot weather codex volume battery

wm-restack = generic
override-redirect = false
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[bar/main-tray]
inherit = bar/main
modules-right = reboot weather codex volume battery tray

[module/brightness]
type = custom/script
exec = $HOME/.local/bin/polybar-status brightness
interval = 2
format = <label>
label = %output%
label-foreground = ${colors.green-soft}

[module/network]
type = custom/script
exec = $HOME/.local/bin/polybar-status network
interval = 2
format = <label>
label = %output%
label-foreground = ${colors.green}

[module/bluetooth]
type = custom/script
exec = $HOME/.local/bin/polybar-status bluetooth
interval = 5
format = <label>
label = %output%
label-foreground = ${colors.cyan}

[module/memory]
type = internal/memory
interval = 5
format = <label>
label = 󰍛 %percentage_used%%
label-foreground = ${colors.teal}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label =  %percentage:2%%
label-foreground = ${colors.blue}

[module/swap]
type = custom/script
exec = $HOME/.local/bin/polybar-status swap
interval = 5
format = <label>
label = %output%
label-foreground = ${colors.yellow}

[module/date]
type = internal/date
interval = 1
date = %a %b %e %H:%M
label = %date%
label-foreground = ${colors.text}

[module/reboot]
type = custom/script
exec = $HOME/.local/bin/polybar-status reboot
interval = 60
format = <label>
label = %output%

[module/weather]
type = custom/script
exec = $HOME/.local/bin/polybar-status weather
interval = 900
format = <label>
label = %output%
label-foreground = ${colors.blue}

[module/codex]
type = custom/script
exec = $HOME/.local/bin/polybar-status codex
interval = 60
format = <label>
label = %output%
label-foreground = ${colors.green}

[module/volume]
type = internal/pulseaudio
use-ui-max = true
interval = 1
format-volume = <label-volume>
format-muted = <label-muted>
label-volume = 󰕾 %percentage%%
label-volume-foreground = ${colors.blue}
label-muted = 󰝟 muted
label-muted-foreground = ${colors.muted}

[module/battery]
type = custom/script
exec = $HOME/.local/bin/polybar-status battery
interval = 10
format = <label>
label = %output%
label-foreground = ${colors.text}

[module/tray]
type = internal/tray
format-margin = 4pt
tray-padding = 4pt
tray-spacing = 8pt
tray-size = 80%
tray-foreground = ${colors.text}

[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
